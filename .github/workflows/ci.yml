name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check formatting
        run: yarn format:ci
      - name: Build
        run: yarn build
      - name: Restore baseline size snapshots
        # Build generates snapshots; checks must compare against committed values.
        run: git ls-files -z '**/.size-snapshot.json' | xargs -0 git restore --
      - name: Run checks
        run: yarn check:all
      - name: Run tests
        run: yarn test --browsers ChromeHeadless
      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
