name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:ci
      - name: Build
        run: pnpm run build
      - name: Test build artifacts
        run: pnpm run test:build
      - name: Run checks
        run: pnpm run check:all
      - name: Run unit tests
        run: pnpm run test:unit
      - name: Test release tooling
        run: pnpm run test:release
      - name: Install Chromium for Vitest
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm run test:browser --coverage
      - name: Pack Node 10 consumer
        id: pack
        run: node scripts/pack-node10-consumer.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 10.24.1
      - name: Install packaged consumer
        working-directory: ${{ steps.pack.outputs.consumer }}
        run: npm install --no-package-lock
      - name: Smoke test packaged consumer (development)
        working-directory: ${{ steps.pack.outputs.consumer }}
        run: NODE_ENV=development node smoke.js
      - name: Smoke test packaged consumer (production)
        working-directory: ${{ steps.pack.outputs.consumer }}
        run: NODE_ENV=production node smoke.js
      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
