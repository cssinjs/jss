name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (prereleases use alpha.N)
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Update versions and changelog
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release.js prepare "$BUMP"
      - name: Refresh lockfile and package READMEs
        run: |
          yarn install --ignore-scripts --non-interactive
          yarn build
          yarn prettier --write lerna.json changelog.md 'packages/*/package.json' 'packages/*/readme.md'
      - name: Push release branch
        run: |
          VERSION=$(node -p 'require("./lerna.json").version')
          BRANCH="release/v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add lerna.json changelog.md yarn.lock packages/*/package.json packages/*/readme.md
          git -c core.hooksPath=/dev/null commit -m "Release v${VERSION}"
          git push origin "$BRANCH"
          {
            echo "## Release v${VERSION} prepared"
            echo "[Open the release PR](https://github.com/${GITHUB_REPOSITORY}/compare/master...${BRANCH}?expand=1)"
            echo ''
            echo 'Open the PR manually so normal pull_request CI runs. Review the changelog before merging.'
          } >> "$GITHUB_STEP_SUMMARY"
